<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Xode</title>
<meta name="description" content="Xode" />
<link rel="icon" type="image/png" href="assets/logo.png" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet" />
<style>
  :root {
    --bg: #1f1f22;
    --bg-soft: #26262a;
    --fg: #e7e7ec;
    --muted: #8a8a96;
    --accent: #7c8cf0;
    --accent-deep: #5a6ed4;
    --logo-avg: #373d57;
    --side-col: 11rem;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    background: var(--bg);
    color: var(--fg);
    font-family: "JetBrains Mono", ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    display: grid;
    place-items: center;
    padding: 2rem;
    -webkit-font-smoothing: antialiased;
  }
  main {
    display: grid;
    grid-template-columns: var(--side-col) auto var(--side-col);
    grid-template-rows: auto auto auto;
    column-gap: 0.5rem;
    align-items: center;
    justify-items: center;
  }
  .logo-link {
    grid-column: 2;
    grid-row: 1;
    display: inline-block;
    margin-bottom: 1.25rem;
    line-height: 0;
  }
  .logo {
    width: 128px;
    height: 128px;
    image-rendering: -webkit-optimize-contrast;
    filter: drop-shadow(0 8px 24px rgba(124,140,240,0.35));
    animation: float 6s ease-in-out infinite;
  }
  @keyframes float {
    0%, 100% { transform: translateY(0); }
    50%      { transform: translateY(-6px); }
  }
  h1, .bracket {
    font-size: clamp(2.5rem, 8vw, 4rem);
    letter-spacing: 0.04em;
    font-weight: 600;
    line-height: 1;
    margin: 0;
  }
  h1 { grid-column: 2; grid-row: 2; }
  .bracket { color: var(--accent); }
  .bracket .pipe { color: #4a4a52; margin-right: 0.4em; animation: blink 2s step-end infinite; }
  @keyframes blink {
    0%, 50% { opacity: 1; }
    50.01%, 100% { opacity: 0; }
  }
  .bracket-left  { grid-column: 1; grid-row: 2; justify-self: end; white-space: nowrap; }
  .bracket-right { grid-column: 3; grid-row: 2; justify-self: start; }
  .shortcuts {
    grid-column: 1 / -1;
    grid-row: 3;
    justify-self: center;
    display: flex;
    gap: 2.75rem;
    margin-top: 3.5rem;
  }
  .shortcut {
    display: inline-block;
    line-height: 0;
    padding: 0.7rem;
    border: 1px solid #6b6b75;
    border-radius: 12px;
    transition: box-shadow 200ms ease, border-color 200ms ease;
  }
  .shortcut svg {
    width: 34px;
    height: 34px;
    fill: var(--logo-avg);
    transition: fill 200ms ease;
  }
  .shortcut:hover {
    border-color: var(--accent);
    box-shadow: 0 4px 22px rgba(138,110,240,0.3), 0 0 12px rgba(124,140,240,0.2);
  }
  .shortcut:hover svg { fill: var(--accent); }
  /* Raster glyphs (transparent PNG) are drawn as a mask so they take the
     same colour as the SVG icons. The Prae phoenix is assets/prae.png,
     embedded so it also works when the page is opened from disk. The phoenix
     fills 113 of its 135px height, so the mask is drawn at 120% height to
     stand 34px tall like the other icons. */
  .shortcut .glyph {
    display: block;
    width: 40px;
    height: 34px;
